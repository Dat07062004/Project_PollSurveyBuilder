<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kết Quả Live Realtime - Poll & Survey Builder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f4f6f9; }
        .card-custom { border: none; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.06); }
        .progress { height: 28px; border-radius: 14px; background-color: #eef2ff; }
        .progress-bar { transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1); font-weight: 700; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div id="main-nav"></div>

    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card card-custom p-4 p-md-5 bg-white">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <span id="badge-code" class="badge bg-dark fs-6 px-3 py-2"></span>
                        <div class="d-flex align-items-center gap-2 text-success fw-bold">
                            <span class="spinner-grow spinner-grow-sm" role="status"></span>
                            <span>Live SignalR</span>
                        </div>
                    </div>

                    <h2 id="poll-title" class="fw-bold text-dark mb-4"></h2>

                    <div class="bg-light p-3 rounded-4 mb-4 d-flex align-items-center justify-content-between">
                        <span class="text-muted fw-bold">Tổng số phiếu bầu:</span>
                        <span id="total-votes" class="badge bg-primary fs-5 px-4 py-2">0</span>
                    </div>

                    <!-- Visual Chart.js Section -->
                    <div class="mb-5 bg-light p-4 rounded-4" style="position: relative; height: 320px;">
                        <canvas id="resultsChart"></canvas>
                    </div>

                    <!-- Progress Bars List -->
                    <h5 class="fw-bold mb-3 text-dark"><i class="bi bi-list-task text-primary me-2"></i>Chi tiết các lượt vote:</h5>
                    <div id="results-list" class="d-flex flex-column gap-4 mb-4"></div>

                    <div id="open-responses-section" class="d-none mt-4">
                        <h4 class="fw-bold mb-3"><i class="bi bi-chat-quote-fill me-2 text-primary"></i>Các ý kiến tự do:</h4>
                        <div id="open-responses-list" class="d-flex flex-column gap-2"></div>
                    </div>

                    <div class="mt-4 pt-3 border-top d-flex flex-wrap gap-2 justify-content-between">
                        <a id="link-poll" href="#" class="btn btn-outline-secondary fw-bold rounded-pill">
                            <i class="bi bi-arrow-left me-1"></i>Trang Bình Chọn
                        </a>
                        <a id="link-qna" href="#" class="btn btn-outline-info fw-bold rounded-pill">
                            <i class="bi bi-chat-dots-fill me-1"></i>Hỏi & Đáp (Q&A)
                        </a>
                        <a id="link-analytics" href="#" class="btn btn-info text-white fw-bold rounded-pill">
                            <i class="bi bi-graph-up-arrow me-1"></i>Phân tích
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
    <script src="navbar.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        let chartInstance = null;

        document.addEventListener("DOMContentLoaded", async () => {
            if (!code) {
                alert("Thiếu mã cuộc thăm dò!");
                window.location.href = "index.html";
                return;
            }

            if (!window.PollAuth.isLoggedIn()) {
                window.showAuthRequiredModal("Vui lòng đăng nhập để xem trang kết quả trực tiếp.");
                return;
            }

            document.getElementById('badge-code').innerText = code;
            document.getElementById('link-poll').href = `poll.html?code=${code}`;
            document.getElementById('link-qna').href = `qna.html?code=${code}`;
            document.getElementById('link-analytics').href = `analytics.html?code=${code}`;

            await loadResults();
            initSignalR();
        });

        async function loadResults() {
            try {
                const res = await fetch(`/api/polls/${code}/results`, {
                    headers: window.PollAuth.getAuthHeaders()
                });
                if (!res.ok) throw new Error("Không thể tải kết quả.");

                const data = await res.json();
                renderResults(data);
            } catch (err) {
                console.error(err);
            }
        }

        function renderResults(data) {
            document.getElementById('poll-title').innerText = data.pollTitle || data.title;
            document.getElementById('total-votes').innerText = data.totalVotes;

            const list = document.getElementById('results-list');
            list.innerHTML = '';

            const colors = ['#4f46e5', '#10b981', '#06b6d4', '#f59e0b', '#ef4444', '#1f2937'];
            const bgClasses = ['bg-primary', 'bg-success', 'bg-info', 'bg-warning', 'bg-danger', 'bg-dark'];

            const labels = [];
            const voteCounts = [];
            const bgColors = [];

            if (data.options && data.options.length > 0) {
                data.options.forEach((opt, idx) => {
                    labels.push(opt.optionText);
                    voteCounts.push(opt.voteCount);
                    bgColors.push(colors[idx % colors.length]);

                    const colorClass = bgClasses[idx % bgClasses.length];
                    const div = document.createElement('div');
                    div.innerHTML = `
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <span class="fw-bold fs-6 text-dark">${escapeHtml(opt.optionText)}</span>
                            <span class="fw-bold text-muted">${opt.voteCount} phiếu (${opt.percentage}%)</span>
                        </div>
                        <div class="progress">
                            <div class="progress-bar ${colorClass}" role="progressbar" style="width: ${opt.percentage}%">
                                ${opt.percentage > 5 ? opt.percentage + '%' : ''}
                            </div>
                        </div>
                    `;
                    list.appendChild(div);
                });

                renderChart(labels, voteCounts, bgColors);
            }

            if (data.openTextResponses && data.openTextResponses.length > 0) {
                const section = document.getElementById('open-responses-section');
                const respList = document.getElementById('open-responses-list');
                section.classList.remove('d-none');
                respList.innerHTML = '';
                data.openTextResponses.forEach(text => {
                    const item = document.createElement('div');
                    item.className = 'p-3 bg-light rounded-3 border-start border-4 border-primary';
                    item.innerText = text;
                    respList.appendChild(item);
                });
            }
        }

        function renderChart(labels, data, colors) {
            const ctx = document.getElementById('resultsChart').getContext('2d');
            if (chartInstance) {
                chartInstance.data.labels = labels;
                chartInstance.data.datasets[0].data = data;
                chartInstance.data.datasets[0].backgroundColor = colors;
                chartInstance.update();
            } else {
                chartInstance = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Số phiếu bầu',
                            data: data,
                            backgroundColor: colors,
                            borderRadius: 8
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false }
                        },
                        scales: {
                            y: { beginAtZero: true, ticks: { precision: 0 } }
                        }
                    }
                });
            }
        }

        function initSignalR() {
            const connection = new signalR.HubConnectionBuilder()
                .withUrl("/hubs/poll")
                .withAutomaticReconnect()
                .build();

            connection.on("ReceiveVoteUpdate", (updatedResults) => {
                renderResults(updatedResults);
            });

            connection.start().then(() => {
                connection.invoke("JoinPollGroup", code);
            }).catch(err => console.error(err));
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
