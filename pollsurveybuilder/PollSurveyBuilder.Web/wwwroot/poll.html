<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bỏ Phiếu Cuộc Thăm Dò - Poll & Survey Builder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f4f6f9; }
        .poll-card { border: none; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.06); }
        .option-label { cursor: pointer; border: 2px solid #e5e7eb; border-radius: 14px; padding: 16px 20px; transition: all 0.2s ease; display: block; }
        .option-label:hover { border-color: #6366f1; background-color: #f5f3ff; }
        .btn-check:checked + .option-label { border-color: #4f46e5; background-color: #eef2ff; font-weight: 700; color: #4f46e5; }
    </style>
</head>
<body>
    <div id="main-nav"></div>

    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-7">
                <div id="loading" class="text-center py-5">
                    <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status"></div>
                    <p class="mt-3 text-muted fw-semibold">Đang tải cuộc thăm dò...</p>
                </div>

                <div id="poll-container" class="card poll-card p-4 p-md-5 bg-white d-none">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <span id="badge-code" class="badge bg-dark fs-6 px-3 py-2"></span>
                        <span id="badge-status" class="badge bg-success fs-6 px-3 py-2">Đang hoạt động</span>
                    </div>

                    <h2 id="poll-title" class="fw-bold text-dark mb-2"></h2>
                    <p id="poll-desc" class="text-muted mb-4"></p>

                    <form id="vote-form">
                        <div id="options-area" class="d-flex flex-column gap-3 mb-4"></div>

                        <div id="open-text-area" class="mb-4 d-none">
                            <label class="form-label fw-bold">Câu trả lời của bạn:</label>
                            <textarea id="text-response" class="form-control form-control-lg border-2" rows="3" placeholder="Nhập ý kiến của bạn..."></textarea>
                        </div>

                        <button type="submit" id="btn-submit-vote" class="btn btn-primary btn-lg w-100 fw-bold py-3 shadow rounded-pill">
                            <i class="bi bi-check-circle-fill me-2"></i>Gửi Bình Chọn Của Tôi
                        </button>
                    </form>

                    <div class="mt-4 pt-3 border-top d-flex justify-content-between">
                        <a id="link-qna" href="#" class="btn btn-outline-info fw-semibold rounded-pill">
                            <i class="bi bi-chat-dots-fill me-1"></i>Hỏi & Đáp (Q&A Live)
                        </a>
                        <a id="link-results" href="#" class="btn btn-outline-primary fw-semibold rounded-pill">
                            <i class="bi bi-bar-chart-line-fill me-1"></i>Xem kết quả Live
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="navbar.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');

        let voterToken = localStorage.getItem('voterToken');
        if (!voterToken) {
            voterToken = 'voter_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('voterToken', voterToken);
        }

        document.addEventListener("DOMContentLoaded", async () => {
            if (!code) {
                alert("Thiếu mã cuộc thăm dò!");
                window.location.href = "index.html";
                return;
            }

            try {
                const res = await fetch(`/api/polls/${code}`);
                if (!res.ok) throw new Error("Không tìm thấy cuộc thăm dò.");

                const poll = await res.json();
                renderPoll(poll);
            } catch (err) {
                alert(err.message);
            }
        });

        function renderPoll(poll) {
            document.getElementById('loading').classList.add('d-none');
            document.getElementById('poll-container').classList.remove('d-none');

            document.getElementById('badge-code').innerText = poll.code;
            document.getElementById('poll-title').innerText = poll.title;
            document.getElementById('poll-desc').innerText = poll.description || '';

            // Status Badge & Vote Button Control
            const statusBadge = document.getElementById('badge-status');
            const btnSubmit = document.getElementById('btn-submit-vote');

            if (poll.isClosed) {
                statusBadge.className = 'badge bg-secondary fs-6 px-3 py-2';
                statusBadge.innerText = '🔒 Đã đóng';
                btnSubmit.disabled = true;
                btnSubmit.innerText = '🔒 Cuộc thăm dò này đã bị đóng';
                btnSubmit.className = 'btn btn-secondary btn-lg w-100 fw-bold py-3 shadow rounded-pill';
            } else if (poll.isExpired) {
                statusBadge.className = 'badge bg-danger fs-6 px-3 py-2';
                statusBadge.innerText = '⏰ Hết hạn';
                btnSubmit.disabled = true;
                btnSubmit.innerText = '⏰ Cuộc thăm dò này đã hết hạn';
                btnSubmit.className = 'btn btn-danger btn-lg w-100 fw-bold py-3 shadow rounded-pill';
            } else {
                statusBadge.className = 'badge bg-success fs-6 px-3 py-2';
                statusBadge.innerText = '🟢 Đang hoạt động';
            }

            document.getElementById('link-qna').href = `qna.html?code=${poll.code}`;
            document.getElementById('link-results').href = `results.html?code=${poll.code}`;

            const optionsArea = document.getElementById('options-area');
            const openTextArea = document.getElementById('open-text-area');

            if (poll.questionType === 3) { // Open Text
                optionsArea.classList.add('d-none');
                openTextArea.classList.remove('d-none');
            } else {
                poll.options.forEach((opt, idx) => {
                    const div = document.createElement('div');
                    div.innerHTML = `
                        <input type="radio" class="btn-check" name="voteOption" id="opt-${idx}" value="${idx}" ${idx === 0 ? 'checked' : ''} ${poll.isClosed || poll.isExpired ? 'disabled' : ''}>
                        <label class="option-label" for="opt-${idx}">
                            <div class="d-flex align-items-center justify-content-between">
                                <span class="fs-5">${escapeHtml(opt.optionText)}</span>
                                <i class="bi bi-circle check-icon fs-5"></i>
                            </div>
                        </label>
                    `;
                    optionsArea.appendChild(div);
                });
            }

            document.getElementById('vote-form').addEventListener('submit', async (e) => {
                e.preventDefault();

                if (poll.isClosed || poll.isExpired) {
                    alert("Cuộc thăm dò này đã đóng hoặc hết hạn, không thể gửi thêm bình chọn.");
                    return;
                }

                let selectedIndex = 0;
                let textResp = null;

                if (poll.questionType === 3) { // Open Text
                    textResp = document.getElementById('text-response').value.trim();
                    if (!textResp) {
                        alert("Vui lòng nhập ý kiến của bạn.");
                        return;
                    }
                } else {
                    const checked = document.querySelector('input[name="voteOption"]:checked');
                    if (checked) selectedIndex = parseInt(checked.value);
                }

                try {
                    const response = await fetch(`/api/polls/${poll.code}/vote`, {
                        method: 'POST',
                        headers: window.PollAuth.getAuthHeaders(),
                        body: JSON.stringify({
                            optionIndex: selectedIndex,
                            voterToken: voterToken,
                            textResponse: textResp
                        })
                    });

                    const data = await response.json();
                    if (!response.ok) {
                        alert(data.message || "Không thể thực hiện bình chọn.");
                        return;
                    }

                    alert("Bình chọn thành công!");
                    window.location.href = `results.html?code=${poll.code}`;
                } catch (err) {
                    alert("Lỗi khi kết nối API: " + err.message);
                }
            });
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
