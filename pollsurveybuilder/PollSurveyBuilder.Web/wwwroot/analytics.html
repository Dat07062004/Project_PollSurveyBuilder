<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Report - Poll & Survey Builder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f4f6f9; }
        .card-custom { border: none; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.06); }
    </style>
</head>
<body>
    <div id="main-nav"></div>

    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="card card-custom p-4 p-md-5 bg-white mb-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <span id="badge-code" class="badge bg-dark fs-6 px-3 py-2"></span>
                        <span class="badge bg-info text-white fs-6 px-3 py-2"><i class="bi bi-graph-up me-1"></i>Distinction Analytics</span>
                    </div>

                    <h2 id="poll-title" class="fw-bold text-dark mb-4"></h2>

                    <div class="row g-4 mb-5">
                        <div class="col-md-4">
                            <div class="p-4 bg-primary bg-opacity-10 rounded-4 text-center">
                                <i class="bi bi-people-fill text-primary display-5 mb-2"></i>
                                <div class="text-muted fw-semibold">Total Votes</div>
                                <div id="stat-total" class="display-6 fw-bold text-primary">0</div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="p-4 bg-success bg-opacity-10 rounded-4 text-center">
                                <i class="bi bi-trophy-fill text-success display-5 mb-2"></i>
                                <div class="text-muted fw-semibold">Leading Option</div>
                                <div id="stat-top" class="fs-5 fw-bold text-success text-truncate mt-2">N/A</div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="p-4 bg-warning bg-opacity-10 rounded-4 text-center">
                                <i class="bi bi-clock-history text-warning display-5 mb-2"></i>
                                <div class="text-muted fw-semibold">Peak Minute</div>
                                <div id="stat-peak" class="fs-5 fw-bold text-warning text-truncate mt-2">N/A</div>
                            </div>
                        </div>
                    </div>

                    <h4 class="fw-bold mb-3"><i class="bi bi-activity text-primary me-2"></i>Vote Timeline Chart:</h4>
                    <div class="bg-light p-4 rounded-4 mb-4" style="height: 350px;">
                        <canvas id="timelineChart"></canvas>
                    </div>

                    <div class="mt-4 pt-3 border-top d-flex justify-content-between">
                        <a id="link-results" href="#" class="btn btn-outline-primary fw-bold rounded-pill">
                            <i class="bi bi-arrow-left me-1"></i>Back to Live Results
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="navbar.js?v=2"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        let chartInstance = null;

        document.addEventListener("DOMContentLoaded", async () => {
            if (!code) {
                alert("Missing poll code!");
                window.location.href = "index.html";
                return;
            }

            if (!window.PollAuth.isLoggedIn()) {
                window.showAuthRequiredModal("Please log in to view Analytics report.");
                return;
            }

            document.getElementById('badge-code').innerText = code;
            document.getElementById('link-results').href = `results.html?code=${code}`;

            await loadAnalytics();
        });

        async function loadAnalytics() {
            try {
                const res = await fetch(`/api/polls/${code}/analytics`, {
                    headers: window.PollAuth.getAuthHeaders()
                });
                if (!res.ok) throw new Error("Cannot load analytics report.");

                const data = await res.json();
                renderAnalytics(data);
            } catch (err) {
                console.error(err);
            }
        }

        function renderAnalytics(data) {
            document.getElementById('poll-title').innerText = data.title;
            document.getElementById('stat-total').innerText = data.totalVotes;
            document.getElementById('stat-top').innerText = data.topOption;
            document.getElementById('stat-peak').innerText = data.peakVotingMinute || 'N/A';

            const labels = (data.votesOverTime || []).map(p => p.timeLabel);
            const values = (data.votesOverTime || []).map(p => p.count);

            const ctx = document.getElementById('timelineChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels.length > 0 ? labels : ['No Data'],
                    datasets: [{
                        label: 'Vote Count',
                        data: values.length > 0 ? values : [0],
                        borderColor: '#4f46e5',
                        backgroundColor: 'rgba(79, 70, 229, 0.1)',
                        fill: true,
                        tension: 0.3,
                        pointRadius: 6,
                        pointBackgroundColor: '#4f46e5'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { beginAtZero: true, ticks: { precision: 0 } }
                    }
                }
            });
        }
    </script>
</body>
</html>
