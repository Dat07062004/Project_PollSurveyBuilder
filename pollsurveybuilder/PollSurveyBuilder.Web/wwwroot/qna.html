<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q&A Live (Hỏi & Đáp Ẩn Danh) - Poll & Survey Builder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f4f6f9; }
        .card-custom { border: none; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.06); }
        .qna-item { border-radius: 16px; transition: all 0.2s ease; border: 1px solid #e5e7eb; }
        .qna-item.pinned { border-left: 6px solid #4f46e5; background-color: #f5f3ff; }
    </style>
</head>
<body>
    <div id="main-nav"></div>

    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card card-custom p-4 p-md-5 bg-white">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <span id="badge-code" class="badge bg-dark fs-6 px-3 py-2"></span>
                        <span class="badge bg-info text-white fs-6 px-3 py-2"><i class="bi bi-chat-left-dots-fill me-1"></i>Distinction Live Q&A</span>
                    </div>

                    <h2 class="fw-bold text-dark mb-4">Hỏi & Đáp Ẩn Danh Trực Tiếp</h2>

                    <!-- Form Đặt Câu Hỏi -->
                    <form id="qna-form" class="mb-5">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Đặt câu hỏi cho diễn giả / chủ cuộc họp:</label>
                            <textarea id="question-text" class="form-control form-control-lg border-2" rows="3" placeholder="Nhập câu hỏi của bạn ở đây..." required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg fw-bold rounded-pill px-4 shadow">
                            <i class="bi bi-send-fill me-2"></i>Gửi Câu Hỏi
                        </button>
                    </form>

                    <h4 class="fw-bold mb-3"><i class="bi bi-question-circle-fill text-primary me-2"></i>Danh sách câu hỏi:</h4>
                    <div id="qna-list" class="d-flex flex-column gap-3 mb-4"></div>

                    <div class="mt-4 pt-3 border-top d-flex justify-content-between">
                        <a id="link-poll" href="#" class="btn btn-outline-secondary fw-bold rounded-pill">
                            <i class="bi bi-arrow-left me-1"></i>Trang Bình Chọn
                        </a>
                        <a id="link-results" href="#" class="btn btn-primary fw-bold rounded-pill">
                            <i class="bi bi-bar-chart-fill me-1"></i>Xem kết quả Live
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
    <script src="navbar.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');

        let voterToken = localStorage.getItem('voterToken');
        if (!voterToken) {
            voterToken = 'voter_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('voterToken', voterToken);
        }

        document.addEventListener("DOMContentLoaded", async () => {
            if (!code) {
                alert("Thiếu mã cuộc thăm dò!");
                window.location.href = "index.html";
                return;
            }

            document.getElementById('badge-code').innerText = code;
            document.getElementById('link-poll').href = `poll.html?code=${code}`;
            document.getElementById('link-results').href = `results.html?code=${code}`;

            await loadQuestions();
            initSignalR();
        });

        async function loadQuestions() {
            try {
                const res = await fetch(`/api/polls/${code}/qna`, {
                    headers: window.PollAuth.getAuthHeaders()
                });
                if (!res.ok) throw new Error("Không thể tải danh sách Q&A.");

                const questions = await res.json();
                renderQuestions(questions);
            } catch (err) {
                console.error(err);
            }
        }

        function renderQuestions(questions) {
            const list = document.getElementById('qna-list');
            list.innerHTML = '';

            if (!questions || questions.length === 0) {
                list.innerHTML = '<p class="text-muted italic py-3 text-center">Chưa có câu hỏi nào. Hãy là người đầu tiên đặt câu hỏi!</p>';
                return;
            }

            questions.forEach(q => {
                const div = document.createElement('div');
                div.className = `p-4 qna-item bg-white ${q.isPinned ? 'pinned' : ''}`;
                div.innerHTML = `
                    <div class="d-flex justify-content-between align-items-start gap-3">
                        <div>
                            ${q.isPinned ? '<span class="badge bg-primary mb-2"><i class="bi bi-pin-angle-fill me-1"></i>Đã ghim</span>' : ''}
                            <p class="fs-5 fw-semibold text-dark mb-1">${escapeHtml(q.questionText)}</p>
                            <span class="text-muted small">${new Date(q.createdAt).toLocaleTimeString('vi-VN')}</span>
                        </div>
                        <div class="d-flex align-items-center gap-2">
                            <button class="btn btn-outline-primary btn-sm fw-bold rounded-pill" onclick="upvoteQuestion('${q.id}')">
                                <i class="bi bi-hand-thumbs-up-fill me-1"></i>${q.upvotes}
                            </button>
                            <button class="btn btn-outline-warning btn-sm fw-bold rounded-pill" onclick="togglePinQuestion('${q.id}')">
                                <i class="bi bi-pin-angle-fill me-1"></i>${q.isPinned ? 'Bỏ ghim' : 'Ghim'}
                            </button>
                        </div>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        document.getElementById('qna-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const text = document.getElementById('question-text').value.trim();
            if (!text) return;

            try {
                const res = await fetch(`/api/polls/${code}/qna`, {
                    method: 'POST',
                    headers: window.PollAuth.getAuthHeaders(),
                    body: JSON.stringify({ questionText: text, voterToken: voterToken })
                });

                if (res.ok) {
                    document.getElementById('question-text').value = '';
                    await loadQuestions();
                } else {
                    const err = await res.json();
                    alert(err.message || "Không thể gửi câu hỏi.");
                }
            } catch (err) {
                alert(err.message);
            }
        });

        async function upvoteQuestion(id) {
            try {
                await fetch(`/api/polls/qna/${id}/upvote`, {
                    method: 'POST',
                    headers: window.PollAuth.getAuthHeaders()
                });
                await loadQuestions();
            } catch (err) {
                console.error(err);
            }
        }

        async function togglePinQuestion(id) {
            try {
                await fetch(`/api/polls/qna/${id}/pin`, {
                    method: 'POST',
                    headers: window.PollAuth.getAuthHeaders()
                });
                await loadQuestions();
            } catch (err) {
                console.error(err);
            }
        }

        function initSignalR() {
            const connection = new signalR.HubConnectionBuilder()
                .withUrl("/hubs/poll")
                .withAutomaticReconnect()
                .build();

            connection.on("ReceiveNewQuestion", () => {
                loadQuestions();
            });

            connection.start().then(() => {
                connection.invoke("JoinPollGroup", code);
            }).catch(err => console.error(err));
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
