<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Dashboard - Poll & Survey Builder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-10">

                <!-- Navigation Header -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="fw-bold brand-title mb-0"><i class="bi bi-graph-up-arrow me-2"></i>Analytics Dashboard
                    </h2>
                    <div>
                        <a id="resultsLink" href="#" class="btn btn-outline-light btn-sm me-2"><i
                                class="bi bi-bar-chart-fill me-1"></i>Trang Results</a>
                        <a id="qnaLink" href="#" class="btn btn-outline-info btn-sm"><i
                                class="bi bi-chat-quote-fill me-1"></i>Trang Q&A</a>
                    </div>
                </div>

                <!-- Metric KPI Cards -->
                <div class="row mb-4 g-3">
                    <div class="col-md-4">
                        <div class="glass-card p-4 text-center">
                            <div class="text-secondary small fw-semibold text-uppercase">Tổng Phiếu Bầu</div>
                            <div id="totalVotesCard" class="display-4 fw-bold text-info my-2">0</div>
                            <div class="text-muted small"><i class="bi bi-people-fill me-1"></i>Tổng số lượt bình chọn
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="glass-card p-4 text-center">
                            <div class="text-secondary small fw-semibold text-uppercase">Phút Bỏ Phiếu Cao Nhất</div>
                            <div id="peakMinuteCard" class="fs-4 fw-bold text-warning my-2 text-truncate">N/A</div>
                            <div class="text-muted small"><i class="bi bi-clock-history me-1"></i>Peak Voting Minute
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="glass-card p-4 text-center">
                            <div class="text-secondary small fw-semibold text-uppercase">Tùy Chọn Dẫn Đầu</div>
                            <div id="topOptionCard" class="fs-4 fw-bold text-success my-2 text-truncate">N/A</div>
                            <div class="text-muted small"><i class="bi bi-trophy-fill me-1"></i>Top Answer Option</div>
                        </div>
                    </div>
                </div>

                <!-- Trend Line Chart -->
                <div class="glass-card p-4 p-md-5 mb-4">
                    <h4 class="fw-bold mb-4"><i class="bi bi-activity text-primary me-2"></i>Xu Hướng Bỏ Phiếu Theo Thời
                        Gian (Line Chart)</h4>
                    <div style="height: 320px;">
                        <canvas id="trendChart"></canvas>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5000/api/polls';
        const urlParams = new URLSearchParams(window.location.search);
        const pollCode = urlParams.get('code');

        if (!pollCode) {
            alert('Mã poll không hợp lệ.');
            window.location.href = 'index.html';
        }

        document.getElementById('resultsLink').href = `results.html?code=${pollCode}`;
        document.getElementById('qnaLink').href = `qna.html?code=${pollCode}`;

        async function loadAnalytics() {
            try {
                const resp = await fetch(`${API_BASE}/${pollCode}/analytics`);
                if (!resp.ok) {
                    alert('Không thể tải dữ liệu phân tích.');
                    return;
                }
                const data = await resp.json();

                document.getElementById('totalVotesCard').innerText = data.totalVotes;
                document.getElementById('peakMinuteCard').innerText = data.peakVotingMinute;
                document.getElementById('topOptionCard').innerText = data.topOption;

                renderTrendChart(data.votesOverTime);
            } catch (err) {
                console.error('Analytics load failed', err);
            }
        }

        function renderTrendChart(points) {
            const labels = points.map(p => p.timeLabel);
            const values = points.map(p => p.count);

            const ctx = document.getElementById('trendChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels.length ? labels : ['Bắt đầu'],
                    datasets: [{
                        label: 'Số lượt bỏ phiếu',
                        data: values.length ? values : [0],
                        borderColor: '#6366f1',
                        backgroundColor: 'rgba(99, 102, 241, 0.2)',
                        fill: true,
                        tension: 0.3,
                        pointRadius: 5,
                        pointBackgroundColor: '#a855f7'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true, ticks: { color: '#94a3b8', stepSize: 1 } },
                        x: { ticks: { color: '#f8fafc' } }
                    }
                }
            });
        }

        loadAnalytics();
    </script>
</body>

</html>
