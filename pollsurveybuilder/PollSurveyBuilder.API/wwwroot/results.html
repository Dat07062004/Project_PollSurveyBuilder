<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kết Quả Live - Realtime Poll Results</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
</head>
<body>
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-9">
        
        <!-- Status Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div>
            <span class="badge badge-live px-3 py-2 rounded-pill me-2">
              <i class="bi bi-broadcast me-1"></i>SignalR WebSocket Connected
            </span>
            <span id="pollStatusBadge" class="badge bg-success px-3 py-2 rounded-pill">Đang Mở Bỏ Phiếu</span>
          </div>
          <div>
            <a id="analyticsLink" href="#" class="btn btn-outline-warning btn-sm me-2">
              <i class="bi bi-graph-up me-1"></i>Analytics
            </a>
            <a id="qnaLink" href="#" class="btn btn-outline-info btn-sm me-2">
              <i class="bi bi-chat-dots me-1"></i>Q&A Live
            </a>
            <button id="closePollBtn" class="btn btn-outline-danger btn-sm">
              <i class="bi bi-lock-fill me-1"></i>Đóng Poll
            </button>
          </div>
        </div>

        <div class="glass-card p-4 p-md-5">
          <div class="d-flex justify-content-between align-items-start mb-3">
            <div>
              <h2 id="resultsTitle" class="fw-bold mb-1">Đang tải kết quả...</h2>
              <p id="totalVotesCount" class="text-secondary fs-5 mb-0">Tổng phiếu bầu: 0</p>
            </div>
            <button class="btn btn-outline-light btn-sm" id="copyShareBtn">
              <i class="bi bi-share-fill me-1"></i>Chia sẻ Link
            </button>
          </div>

          <hr class="border-secondary my-4">

          <!-- Animated Progress Bars -->
          <div id="barsContainer" class="mb-5">
            <!-- Dynamic vote bar items -->
          </div>

          <!-- Chart Visualizer -->
          <div class="row align-items-center mt-4">
            <div class="col-md-7 mb-4 mb-md-0">
              <h5 class="fw-bold text-center mb-3">Biểu Đồ Thanh Tương Tác</h5>
              <div style="height: 300px;">
                <canvas id="voteBarChart"></canvas>
              </div>
            </div>
            <div class="col-md-5">
              <h5 class="fw-bold text-center mb-3">Phân Phối Tỷ Lệ</h5>
              <div style="height: 250px;">
                <canvas id="votePieChart"></canvas>
              </div>
            </div>
          </div>

          <!-- Open text answers section -->
          <div id="openTextSection" class="mt-5 d-none">
            <h5 class="fw-bold mb-3"><i class="bi bi-chat-left-text me-2 text-info"></i>Ý Kiến & Phản Hồi Từ Độc Giả</h5>
            <div id="openTextList" class="list-group list-group-flush rounded-3">
              <!-- Open text feedback items -->
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function getApiBaseUrl() {
      return '/api/polls';
    }

    function getHubUrl() {
      return '/hubs/poll';
    }

    const urlParams = new URLSearchParams(window.location.search);
    const pollCode = urlParams.get('code');

    if (!pollCode) {
      alert('Mã poll không hợp lệ.');
      window.location.href = 'index.html';
    }

    document.getElementById('analyticsLink').href = `analytics.html?code=${pollCode}`;
    document.getElementById('qnaLink').href = `qna.html?code=${pollCode}`;

    let barChart = null;
    let pieChart = null;

    // Load initial data
    async function loadResults() {
      try {
        const resp = await fetch(`${getApiBaseUrl()}/${pollCode}/results`);
        if (!resp.ok) {
          alert('Không tìm thấy poll.');
          return;
        }
        const data = await resp.json();
        updateUI(data);
      } catch (err) {
        console.error('Failed to load initial results', err);
      }
    }

    function updateUI(data) {
      document.getElementById('resultsTitle').innerText = data.title;
      document.getElementById('totalVotesCount').innerText = `Tổng phiếu bầu: ${data.totalVotes}`;

      if (data.isClosed || data.isExpired) {
        const badge = document.getElementById('pollStatusBadge');
        badge.className = 'badge bg-danger px-3 py-2 rounded-pill';
        badge.innerText = data.isClosed ? 'Poll Đã Đóng' : 'Poll Hết Hạn';
        document.getElementById('closePollBtn').disabled = true;
      }

      const barsContainer = document.getElementById('barsContainer');
      barsContainer.innerHTML = '';

      const colors = ['#6366f1', '#a855f7', '#ec4899', '#06b6d4', '#10b981', '#f59e0b'];

      data.options.forEach((opt, idx) => {
        const color = colors[idx % colors.length];
        const item = document.createElement('div');
        item.className = 'mb-3';
        item.innerHTML = `
          <div class="d-flex justify-content-between font-weight-bold mb-1">
            <span class="fw-semibold">${opt.optionText}</span>
            <span class="text-info font-monospace">${opt.voteCount} phiếu (${opt.percentage}%)</span>
          </div>
          <div class="progress bg-dark border border-secondary" style="height: 18px; border-radius: 9px;">
            <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" 
                 style="width: ${opt.percentage}%; background-color: ${color}; transition: width 0.6s ease;" 
                 aria-valuenow="${opt.percentage}" aria-valuemin="0" aria-valuemax="100">
            </div>
          </div>
        `;
        barsContainer.appendChild(item);
      });

      renderCharts(data.options);

      if (data.openTextResponses && data.openTextResponses.length > 0) {
        document.getElementById('openTextSection').classList.remove('d-none');
        const list = document.getElementById('openTextList');
        list.innerHTML = data.openTextResponses.map(t => `
          <div class="list-group-item bg-dark text-white border-secondary py-3">
            <i class="bi bi-quote text-info me-2 fs-5"></i>${t}
          </div>
        `).join('');
      }
    }

    function renderCharts(options) {
      const labels = options.map(o => o.optionText);
      const counts = options.map(o => o.voteCount);
      const colors = ['#6366f1', '#a855f7', '#ec4899', '#06b6d4', '#10b981', '#f59e0b'];

      if (!barChart) {
        const ctxBar = document.getElementById('voteBarChart').getContext('2d');
        barChart = new Chart(ctxBar, {
          type: 'bar',
          data: {
            labels: labels,
            datasets: [{
              label: 'Số phiếu',
              data: counts,
              backgroundColor: colors.slice(0, options.length),
              borderRadius: 6
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              y: { beginAtZero: true, ticks: { color: '#94a3b8', stepSize: 1 } },
              x: { ticks: { color: '#f8fafc' } }
            }
          }
        });
      } else {
        barChart.data.labels = labels;
        barChart.data.datasets[0].data = counts;
        barChart.update();
      }

      if (!pieChart) {
        const ctxPie = document.getElementById('votePieChart').getContext('2d');
        pieChart = new Chart(ctxPie, {
          type: 'doughnut',
          data: {
            labels: labels,
            datasets: [{
              data: counts,
              backgroundColor: colors.slice(0, options.length),
              borderWidth: 2,
              borderColor: '#0f172a'
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { position: 'bottom', labels: { color: '#f8fafc' } }
            }
          }
        });
      } else {
        pieChart.data.labels = labels;
        pieChart.data.datasets[0].data = counts;
        pieChart.update();
      }
    }

    // SignalR WebSocket Live Connection
    const connection = new signalR.HubConnectionBuilder()
      .withUrl(getHubUrl())
      .withAutomaticReconnect()
      .build();

    connection.on("ReceiveVoteUpdate", (results) => {
      console.log("Realtime vote update received:", results);
      updateUI(results);
    });

    connection.on("ReceivePollClosed", (code) => {
      const badge = document.getElementById('pollStatusBadge');
      badge.className = 'badge bg-danger px-3 py-2 rounded-pill';
      badge.innerText = 'Poll Đã Đóng';
      document.getElementById('closePollBtn').disabled = true;
    });

    connection.start().then(() => {
      console.log("Connected to SignalR Hub");
      connection.invoke("JoinPollGroup", pollCode);
    }).catch(err => console.error("SignalR Connection Error:", err));

    document.getElementById('closePollBtn').addEventListener('click', async () => {
      if (!confirm('Bạn có chắc chắn muốn đóng cuộc thăm dò này?')) return;
      const resp = await fetch(`${getApiBaseUrl()}/${pollCode}/close`, { method: 'POST' });
      if (resp.ok) {
        alert('Đã đóng cuộc thăm dò.');
      } else {
        alert('Không thể đóng cuộc thăm dò.');
      }
    });

    document.getElementById('copyShareBtn').addEventListener('click', () => {
      const voteUrl = `${window.location.origin}/poll.html?code=${pollCode}`;
      navigator.clipboard.writeText(voteUrl);
      alert('Đã sao chép link bỏ phiếu: ' + voteUrl);
    });

    loadResults();
  </script>
</body>
</html>
