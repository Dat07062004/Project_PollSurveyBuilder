<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bỏ Phiếu Thăm Dò - Poll & Survey</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-7">
        
        <!-- Header status banner -->
        <div id="statusAlert" class="alert d-none mb-4" role="alert"></div>

        <!-- Poll Card -->
        <div id="pollCard" class="glass-card p-4 p-md-5">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <span class="badge bg-primary px-3 py-2 rounded-pill font-monospace" id="pollCodeBadge">Mã: ------</span>
            <span id="expiryBadge" class="badge bg-secondary px-3 py-2 rounded-pill">Đang tải...</span>
          </div>

          <h2 id="pollTitleDisplay" class="fw-bold mb-2">Đang tải câu hỏi...</h2>
          <p id="pollDescDisplay" class="text-secondary mb-4"></p>

          <form id="voteForm">
            <div id="optionsContainer" class="mb-4">
              <!-- Dynamically generated options -->
            </div>

            <div id="openTextContainer" class="mb-4 d-none">
              <label for="textFeedback" class="form-label fw-semibold">Nhập Câu Trả Lời / Ý Kiến Của Bạn:</label>
              <textarea id="textFeedback" class="form-control bg-dark text-white border-secondary" rows="3" placeholder="Viết phản hồi tại đây..."></textarea>
            </div>

            <div class="d-grid gap-2">
              <button type="submit" id="submitVoteBtn" class="btn btn-gradient btn-lg py-3">
                <i class="bi bi-check2-circle me-2"></i>Gửi Phiếu Bầu
              </button>
            </div>
          </form>

          <div class="d-flex justify-content-between align-items-center mt-4 pt-3 border-top border-secondary">
            <a id="viewResultsBtn" href="#" class="text-info text-decoration-none fw-semibold">
              <i class="bi bi-bar-chart-fill me-1"></i>Xem Kết Quả Trực Tiếp
            </a>
            <a id="openQnABtn" href="#" class="text-warning text-decoration-none fw-semibold">
              <i class="bi bi-chat-quote-fill me-1"></i>Đặt Câu Hỏi Q&A Ẩn Danh
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function getApiBaseUrl() {
      return '/api/polls';
    }

    const urlParams = new URLSearchParams(window.location.search);
    const pollCode = urlParams.get('code');

    if (!pollCode) {
      alert('Mã cuộc thăm dò không hợp lệ.');
      window.location.href = 'index.html';
    }

    let selectedOptionIndex = null;
    let pollData = null;

    async function loadPoll() {
      try {
        const resp = await fetch(`${getApiBaseUrl()}/${pollCode}`);
        if (!resp.ok) {
          showAlert('danger', 'Cuộc thăm dò không tồn tại hoặc đã bị xóa.');
          document.getElementById('pollCard').classList.add('d-none');
          return;
        }

        pollData = await resp.json();

        document.getElementById('pollCodeBadge').innerText = `Mã: ${pollData.code}`;
        document.getElementById('pollTitleDisplay').innerText = pollData.title;
        document.getElementById('pollDescDisplay').innerText = pollData.description || '';

        document.getElementById('viewResultsBtn').href = `results.html?code=${pollCode}`;
        document.getElementById('openQnABtn').href = `qna.html?code=${pollCode}`;

        if (pollData.isClosed) {
          showAlert('warning', 'Cuộc thăm dò này đã bị người tạo đóng. Không thể bỏ phiếu thêm.');
          disableForm();
        } else if (pollData.isExpired) {
          showAlert('warning', 'Cuộc thăm dò này đã hết hạn tự động.');
          disableForm();
        } else if (pollData.hasVoted) {
          showAlert('info', 'Bạn đã thực hiện bỏ phiếu cho cuộc thăm dò này.');
          disableForm();
        }

        renderOptions(pollData.options, pollData.questionType);
      } catch (err) {
        showAlert('danger', 'Không thể kết nối với API backend.');
      }
    }

    function renderOptions(options, questionType) {
      const container = document.getElementById('optionsContainer');
      container.innerHTML = '';

      if (questionType === 3) { // OpenText
        document.getElementById('openTextContainer').classList.remove('d-none');
        selectedOptionIndex = 0;
        return;
      }

      options.forEach(opt => {
        const div = document.createElement('div');
        div.className = 'option-radio-btn d-flex align-items-center justify-content-between';
        div.setAttribute('data-index', opt.optionIndex);
        
        let iconHtml = '<i class="bi bi-circle text-secondary fs-5 me-3 icon-select"></i>';
        if (questionType === 2) {
          iconHtml = '<i class="bi bi-star-fill text-warning fs-5 me-3"></i>';
        }

        div.innerHTML = `
          <div class="d-flex align-items-center">
            ${iconHtml}
            <span class="fs-5 fw-semibold">${opt.optionText}</span>
          </div>
        `;

        div.addEventListener('click', () => {
          if (document.getElementById('submitVoteBtn').disabled) return;

          document.querySelectorAll('.option-radio-btn').forEach(b => {
            b.classList.remove('selected');
            const ic = b.querySelector('.icon-select');
            if (ic) ic.className = 'bi bi-circle text-secondary fs-5 me-3 icon-select';
          });

          div.classList.add('selected');
          const ic = div.querySelector('.icon-select');
          if (ic) ic.className = 'bi bi-check-circle-fill text-primary fs-5 me-3 icon-select';

          selectedOptionIndex = opt.optionIndex;
        });

        container.appendChild(div);
      });
    }

    document.getElementById('voteForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      if (selectedOptionIndex === null && pollData.questionType !== 3) {
        alert('Vui lòng chọn 1 câu trả lời trước khi bình chọn!');
        return;
      }

      const textResponse = document.getElementById('textFeedback').value;

      try {
        const resp = await fetch(`${getApiBaseUrl()}/${pollCode}/vote`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            optionIndex: selectedOptionIndex || 0,
            textResponse: textResponse || null
          })
        });

        const resData = await resp.json();

        if (!resp.ok) {
          showAlert('danger', resData.message || 'Bỏ phiếu thất bại.');
          return;
        }

        showAlert('success', 'Bỏ phiếu thành công! Đang chuyển đến trang kết quả live...');
        setTimeout(() => {
          window.location.href = `results.html?code=${pollCode}`;
        }, 1200);
      } catch (err) {
        alert('Lỗi kết nối khi gửi phiếu bầu.');
      }
    });

    function showAlert(type, msg) {
      const el = document.getElementById('statusAlert');
      el.className = `alert alert-${type} mb-4 fw-semibold`;
      el.innerText = msg;
      el.classList.remove('d-none');
    }

    function disableForm() {
      document.getElementById('submitVoteBtn').disabled = true;
      document.getElementById('submitVoteBtn').innerText = 'Đã Đóng / Đã Bỏ Phiếu';
    }

    loadPoll();
  </script>
</body>
</html>
