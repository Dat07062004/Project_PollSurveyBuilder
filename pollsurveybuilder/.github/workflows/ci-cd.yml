name: Build, Test & Containerize CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore PollSurveyBuilder.slnx

    - name: Build Solution
      run: dotnet build PollSurveyBuilder.slnx --configuration Release --no-restore

    - name: Run xUnit Unit Tests
      run: dotnet test PollSurveyBuilder.Tests/PollSurveyBuilder.Tests.csproj --configuration Release --no-build --verbosity normal

  docker-build:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Build API Docker Image
      run: docker build -t pollsurvey-api:latest -f Dockerfile .

    - name: Build Web UI Docker Image
      run: docker build -t pollsurvey-web:latest -f PollSurveyBuilder.Web/Dockerfile .
